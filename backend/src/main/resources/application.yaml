server:
  port: 8080
  servlet:
    session:
      timeout: 30s

spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: ${MARIADB_DRIVER}
    url: ${MARIADB_URL}
    username: ${MARIADB_USER}
    password: ${MARIADB_PASSWORD}
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB

management:
  info:
    git:
      mode: full
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: false
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /docs
    operationsSorter: method

rsa:
  public-key: ${RSA_PUBLIC_KEY}
  private-key: ${RSA_PRIVATE_KEY}

token:
  expire:
    access: 30
    refresh: 2592000

logging.level.org:
  springframework.security: DEBUG #INFO trace

# api 전달값 로그 확인 가능하게 해주는 명령어 (쿼리문, 결과값)
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl