name: Windows PC Job

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .
      
      - name: Create .env file
        shell: powershell
        run: |
          $backendEnv = @(
            "MARIADB_DRIVER=${{ secrets.MARIADB_DRIVER }}",
            "MARIADB_URL=${{ secrets.MARIADB_URL }}",
            "MARIADB_USER=${{ secrets.MARIADB_USER }}",
            "MARIADB_PASSWORD=${{ secrets.MARIADB_PASSWORD }}",
            "RSA_PUBLIC_KEY=${{ secrets.RSA_PUBLIC_KEY }}",
            "RSA_PRIVATE_KEY=${{ secrets.RSA_PRIVATE_KEY }}"
            # "OLLAMA_HOST=${{ secrets.OLLAMA_HOST }}",
            # "OLLAMA_MODEL=${{ secrets.OLLAMA_MODEL }}",
            # "NEO4J_URI=${{ secrets.NEO4J_URI }}",
            # "NEO4J_USER=${{ secrets.NEO4J_USER }}",
            # "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}",
            # "KAFKA_SERVER=${{ secrets.KAFKA_SERVER }}"
          )
          [System.IO.File]::WriteAllLines("$PWD\backend\.env", $backendEnv)

          # $rootEnv = @(
          #   "NEO4J_USER=${{ secrets.NEO4J_USER }}",
          #   "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}"
          # )
          # [System.IO.File]::WriteAllLines("$PWD\.env", $rootEnv)

          $frontendEnv = @(
            "VITE_API_URL=${{ secrets.VITE_API_URL }}"
          )
          [System.IO.File]::WriteAllLines("$PWD\frontend\.env", $frontendEnv)


      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build
      
      - name: Docker Down
        working-directory: .
        run: docker compose down
        continue-on-error: true

      - name: Docker Up
        working-directory: .
        run: docker compose up -d --build
