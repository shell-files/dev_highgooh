services:
  frontend:
    container_name: frontend
    image: nginx:1.31.1
    restart: always
    networks:
      - main-network
    ports:
      - 80:80
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file:
      - ./backend/.env
    image: backend:1
    networks:
      - main-network
    ports:
      - 8080:8080
    volumes:
      - ../secrets:/app/src/main/resources/secrets:ro

